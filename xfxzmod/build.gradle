plugins {
    id 'net.fabricmc.fabric-loom'
}

version = '1.0.0'
group = 'org.xiaofang_dev'

base {
    archivesName = 'xfxzmod'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    include project(':xfxzlib')
    include project(':xfxzPluginLoader')

    implementation 'net.minecrell:terminalconsoleappender:1.3.0'
    implementation 'org.jline:jline-reader:3.20.0'
    implementation 'org.jline:jline-terminal:3.20.0'
    implementation 'org.jline:jline-terminal-jansi:3.20.0'

    include 'net.minecrell:terminalconsoleappender:1.3.0'
    include 'org.jline:jline-reader:3.20.0'
    include 'org.jline:jline-terminal:3.20.0'
    include 'org.jline:jline-terminal-jansi:3.20.0'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

dependencies {
}
